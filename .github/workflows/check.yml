name: Check launcher

# Every push and pull request: the public front door holds only the launcher,
# with no token, no scripts from unknown hosts, no broken links and no custom
# domain (.github/scripts/check-launcher.py). Pages publishes whatever lands on
# main, so protect main with this check to stop a bad commit reaching users.
#
# GitHub-hosted on purpose: this repository is public, and a self-hosted runner
# would let anyone's pull request run code on it. It needs no secrets.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check the launcher
        run: python3 .github/scripts/check-launcher.py
